name: Windows candidate installer test

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: GitHub Actions run containing the validated libmpv candidate artifact
        required: true
        default: '41150745596'
        type: string
  push:
    branches:
      - test/libmpv-owned-build
    paths:
      - .github/workflows/libmpv-installer-test.yml
      - scripts/windows/owned-libmpv/test_ci_installers.ps1
      - scripts/windows/owned-libmpv/**
      - src-tauri/tauri.windows.conf.json
      - src-tauri/licenses/**

permissions:
  actions: read
  contents: read

concurrency:
  group: windows-candidate-installer-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  installers:
    runs-on: windows-2025
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11
          run_install: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/download-artifact@v8.0.2
        with:
          name: libmpv-windows-x64-candidate
          path: candidate
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id || '41150745596' }}
          github-token: ${{ github.token }}

      - name: Verify and install candidate build inputs
        shell: pwsh
        run: |
          python scripts/windows/owned-libmpv/smoke.py --dll candidate/libmpv-2.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash candidate/libmpv-2.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '6a6ac973ecb495b6799b32d221fdf357f212f9cbd65bc01599670ed6b9d13f56') {
            throw "Unexpected candidate DLL hash: $hash"
          }
          if (-not (Test-Path candidate/mpv.lib)) { throw 'Candidate MSVC import library missing' }
          Copy-Item candidate/libmpv-2.dll src-tauri/libmpv-2.dll -Force
          New-Item -ItemType Directory -Path src-tauri/licenses/ffmpeg, src-tauri/licenses/mpv -Force | Out-Null
          Copy-Item candidate/licenses/ffmpeg/* src-tauri/licenses/ffmpeg -Recurse -Force
          Copy-Item candidate/licenses/mpv/* src-tauri/licenses/mpv -Recurse -Force
          if (-not (Test-Path src-tauri/licenses/mpv/LICENSE.GPL)) {
            throw 'Candidate mpv GPL license was not staged at the configured resource path'
          }
          $env:LIB = "$(Resolve-Path candidate);$env:LIB"
          "LIB=$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Frontend dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.12.4 --locked

      - name: Build isolated MSI and NSIS installers
        shell: pwsh
        run: |
          $config = Join-Path $env:RUNNER_TEMP 'tauri-ci-candidate.json'
          @{
            productName = 'Ryotunes Omni CI Candidate'
            identifier = 'dev.excentry.ryotune-omni.libmpv-ci'
          } | ConvertTo-Json | Set-Content -LiteralPath $config -Encoding utf8
          cargo tauri build --config $config --bundles msi,nsis -- --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $msi = @(Get-ChildItem target/release/bundle/msi -Filter '*.msi' -File -Recurse)
          $nsis = @(Get-ChildItem target/release/bundle/nsis -Filter '*-setup.exe' -File -Recurse)
          if ($msi.Count -ne 1) { throw "Expected one MSI, found $($msi.Count)" }
          if ($nsis.Count -ne 1) { throw "Expected one NSIS setup, found $($nsis.Count)" }
          "MSI=$($msi[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NSIS=$($nsis[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install and uninstall both packages
        shell: pwsh
        run: scripts/windows/owned-libmpv/test_ci_installers.ps1 -MsiPath $env:MSI -NsisPath $env:NSIS -ExpectedDllHash 6a6ac973ecb495b6799b32d221fdf357f212f9cbd65bc01599670ed6b9d13f56
