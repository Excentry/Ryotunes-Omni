name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: stable
          components: rustfmt

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Frontend dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: Frontend type checks
        working-directory: ui
        run: pnpm check

      - name: Frontend unit tests
        working-directory: ui
        run: pnpm test

      - name: Frontend build
        working-directory: ui
        run: pnpm build

      - name: Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'

      - name: Release invariants
        run: python scripts/check-release-invariants.py

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Portable Rust crate tests
        run: cargo test --locked -p innertube -p listen-protocol -p ryotunes-protocol -p ryotunes-soundcloud -p ryotunes-tidal -p sync-server
