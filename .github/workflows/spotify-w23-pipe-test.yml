name: Spotify W23 transport prototypes

on:
  push:
    branches:
      - spike/spotify-channel-libmpv
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Candidate workflow run that contains the validated libmpv DLL
        required: true
        default: '41150745596'
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: spotify-w23-pipe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  named-pipe:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: stable

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: libmpv-windows-x64-candidate
          path: candidate
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id || '41150745596' }}
          github-token: ${{ github.token }}

      - name: Verify candidate DLL
        run: python scripts/windows/owned-libmpv/smoke.py --dll candidate/libmpv-2.dll

      - name: Configure candidate linker and loader paths
        shell: pwsh
        run: |
          $candidate = (Resolve-Path candidate).Path
          "LIB=$candidate;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PATH=$candidate;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify librespot bounded PCM sink
        timeout-minutes: 5
        run: cargo test --locked -p ryotunes-spotify --lib

      - name: Compile and test Spotify W23 lab
        timeout-minutes: 10
        run: |
          cargo check --locked -p ryotunes-core --example spotify_w23_lab
          cargo test --locked -p ryotunes-core --example spotify_w23_lab

      - name: Validate isolated network timeout against closed loopback port
        timeout-minutes: 6
        shell: pwsh
        run: |
          $port = 49173
          if (Get-NetTCPConnection -LocalPort $port -State Listen -ErrorAction SilentlyContinue) {
            throw "Port $port is already listening; choose a different closed port."
          }
          $dataDir = Join-Path $env:RUNNER_TEMP "ryotune-w23-dead-listener"
          cargo run --locked -p ryotunes-core --example spotify_w23_lab -- --dead-listener $port $dataDir

      - name: Validate loopback TCP input
        timeout-minutes: 5
        run: cargo test --locked -p player mpv_reads_synthetic_raw_pcm_from_loopback_tcp_to_eof -- --nocapture --test-threads=1

      - name: Validate named-pipe input and cancellation
        timeout-minutes: 5
        run: cargo test --locked -p player named_pipe_transport_prototype -- --nocapture --test-threads=1
