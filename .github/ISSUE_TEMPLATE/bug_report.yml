name: Bug report
description: Report a problem in Ryotune-Omni
title: "[Bug] "
labels: ["type: bug", "status: needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Report the platform and build you tested. Remove credentials and personal data from logs.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe what you did, what you expected and what happened instead.
      placeholder: "After closing to tray and reopening…"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open …
        2. Play …
        3. Close …
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Target platform
      options:
        - Windows
        - Android
        - Linux reference
        - Other / not platform-specific
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Ryotune-Omni version or commit
      placeholder: "Development build, commit SHA, or omni-v0.1.0"
  - type: input
    id: system
    attributes:
      label: Platform and version
      description: Include OS/device and relevant runtime versions.
      placeholder: "Windows 11 24H2, WebView2 version; Android 15, Pixel 8"
    validations:
      required: true
  - type: dropdown
    id: windows_environment
    attributes:
      label: Is Windows access required to reproduce or verify this bug?
      description: Choose Yes only if a Windows build, runtime, or device is necessary; otherwise choose No or Unsure.
      options:
        - No — logs, source, or another environment are enough to investigate
        - Yes — Windows build, runtime, or device is required
        - Unsure — needs triage
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics / logs
      description: On Linux, paste relevant output from ryotune-omni-diagnostics or attach a log. Windows has no diagnostics tool yet, so include the commit, Windows version and WebView2 version instead. Remove anything private first.
      render: shell
  - type: textarea
    id: media
    attributes:
      label: Screenshots or recording
      description: Drag screenshots or a short screen recording here when the issue is visual.
